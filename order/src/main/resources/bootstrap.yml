server:
  port: 8088  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: order-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - dataId: shared-spring.yaml # 共享spring配置
          - dataId: shared-redis.yaml # 共享redis配置
          - dataId: shared-mybatis.yaml # 共享mybatis配置
          - dataId: shared-logs.yaml # 共享日志配置
          - dataId: shared-feign.yaml # 共享feign配置
          - dataId: shared-mq.yaml # 共享mq配置
          - dataId: shared-xxljob.yaml # 共享mq配置
ac:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.aicomic.order.controller
    title: AI漫剧 - 订单交易中心接口文档
    description: 该服务提供购物车、订单管理等功能
    contact-name: AI漫剧平台
    contact-url: https://github.com/sheepsheep678/AI-comic-drama
    contact-email: ""
    version: v1.0
  jdbc:
    database: aicomic_order
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - "/order-details/purchaseNum"