server:
  port: 8083  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: search-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          - data-id: shared-mq.yaml # 共享MQ配置
            refresh: false
ac:
  swagger:
    enable: true
    package-path: com.aicomic.search.controller
    title: AI漫剧 - 内容搜索接口文档
    description: 该服务包含漫剧搜索、兴趣推荐
    contact-name: AI漫剧平台
    contact-url: https://github.com/sheepsheep678/AI-comic-drama
    contact-email: ""
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /interests/**
        - /comics/admin
  jdbc:
    database: aicomic_search

