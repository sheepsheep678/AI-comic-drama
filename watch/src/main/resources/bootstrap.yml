server:
  port: 8090  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: watch-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          - data-id: shared-mq.yaml # 共享mq配置
            refresh: false
          - data-id: shared-xxljob.yaml # 共享mq配置
            refresh: false
ac:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.aicomic.watch.controller
    title: AI漫剧 - 观看互动中心接口文档
    description: 该服务包含观看进度、笔记、互动与积分
    contact-name: AI漫剧平台
    contact-url: https://github.com/sheepsheep678/AI-comic-drama
    contact-email: ""
    version: v1.0
  jdbc:
    database: aicomic_watch
  auth:
    resource:
      enable: true
