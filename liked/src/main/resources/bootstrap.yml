server:
  port: 8094  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: like-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          - data-id: shared-mq.yaml # 共享mq配置
            refresh: false
ac:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.aicomic.liked.controller
    title: AI漫剧 - 点赞中心接口文档
    description: 该服务提供点赞记录、点赞数统计与点赞数变更消息
    contact-name: AI漫剧平台
    contact-url: https://github.com/sheepsheep678/AI-comic-drama
    contact-email: ""
    version: v1.0
  jdbc:
    database: aicomic_like
  auth:
    resource:
      enable: true # 登录拦截功能
      excludeLoginPaths: # 点赞状态查询允许游客/内部 Feign 调用
        - /likes/list
