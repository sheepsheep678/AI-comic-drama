server:
  port: 8081  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: auth-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
encrypt:
  key-store:
    alias: aicomic  #别名
    location: classpath:aicomic.jks  #KeyStore 证书库名称
    password: AcComic2026   #证书库密码
    secret: AcComic2026   #秘钥
ac:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.aicomic.auth.controller
    title: AI漫剧 - 认证中心接口文档
    description: 该服务用于认证、角色与权限管理
    contact-name: AI漫剧平台
    contact-url: https://github.com/sheepsheep678/AI-comic-drama
    contact-email: ""
    version: v1.0
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /menus/me
        - /accounts/logout
  jdbc:
    database: aicomic_auth