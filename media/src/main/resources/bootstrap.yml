server:
  port: 8084 #端口
  tomcat:
    uri-encoding: UTF-8 #服务编码
spring:
  profiles:
    active: dev
  application:
    name: media-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
ac:
  swagger:
    enable: true
    package-path: com.aicomic.media.controller
    title: AI漫剧 - 视频素材中心接口文档
    description: 该服务包含视频、图片与创作素材管理
    contact-name: AI漫剧平台
    contact-url: https://github.com/sheepsheep678/AI-comic-drama
    contact-email: ""
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
  jdbc:
    database: aicomic_media
  platform:
    file: TENCENT
    media: TENCENT
  tencent:
  cloud:
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    vod:
      enable: true
      vodValidSeconds: 7776000
      region: "ap-shanghai"
      procedure: "wisehub-base"
      urlKey: "HZFlxjPYoOm5AfShupOx"
      pfcg: "basicDrmPreset"
    cos:
      enable: true
      region: "ap-shanghai"
      bucket: wisehub
      multipartUploadThreshold: 5242880 # 5mb，触发分片上传的阈值
      minimumUploadPartSize: 1048576 # 1mb，分片的最小大小
